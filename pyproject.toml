[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-quant-starter"
version = "0.1.0"
description = "A lightweight quant backtesting starter project."
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.0",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
trade = "trade.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trade = ["web_static/*.html", "web_static/*.css", "web_static/*.js"]
